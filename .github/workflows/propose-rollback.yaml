name: Propose image rollback

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment that should return to a prior digest
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      rollback_digest:
        description: Previously approved digest in sha256:<64 lowercase hex> form
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: environment-change-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  propose:
    name: Open rollback pull request
    runs-on: ubuntu-latest
    steps:
      - name: Check out desired state
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Prepare rollback
        id: rollback
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          ROLLBACK_DIGEST: ${{ inputs.rollback_digest }}
        run: |
          short_digest="${ROLLBACK_DIGEST#sha256:}"
          short_digest="${short_digest:0:12}"
          branch="rollback/${TARGET_ENVIRONMENT}-${short_digest}-${GITHUB_RUN_ID}"

          git switch --create "${branch}"
          ./scripts/rollback-image.sh "${TARGET_ENVIRONMENT}" "${ROLLBACK_DIGEST}"
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "applications/vaipex-demo/overlays/${TARGET_ENVIRONMENT}/kustomization.yaml"
          git commit -m "rollback: ${TARGET_ENVIRONMENT} to ${short_digest}"
          git push --set-upstream origin "${branch}"

          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "short_digest=${short_digest}" >> "${GITHUB_OUTPUT}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          ROLLBACK_DIGEST: ${{ inputs.rollback_digest }}
          ROLLBACK_BRANCH: ${{ steps.rollback.outputs.branch }}
          SHORT_DIGEST: ${{ steps.rollback.outputs.short_digest }}
        run: |
          body_file="${RUNNER_TEMP}/rollback-pull-request.md"
          {
            echo "## Rollback"
            echo
            echo "- Target environment: \`${TARGET_ENVIRONMENT}\`"
            echo "- Prior immutable image: \`${ROLLBACK_DIGEST}\`"
            echo "- Requested by: \`${GITHUB_ACTOR}\`"
            echo
            echo "The environment policy must confirm this digest was previously approved."
          } > "${body_file}"

          pull_request_url="$(gh pr create \
            --base main \
            --head "${ROLLBACK_BRANCH}" \
            --title "Rollback ${TARGET_ENVIRONMENT} to ${SHORT_DIGEST}" \
            --body-file "${body_file}")"

          echo "Rollback pull request: ${pull_request_url}" >> "${GITHUB_STEP_SUMMARY}"
